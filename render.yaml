services:
  - type: web
    name: curdos-lancha
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: curdos-postgres
          property: connectionString
      - key: NEXT_PUBLIC_WHATSAPP_PHONE
        value: 5548999999999
      - key: NODE_VERSION
        value: 20.18.0

databases:
  - name: curdos-postgres
    databaseName: curdos_lancha
    user: curdo
    plan: free

